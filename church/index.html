<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcs for Churches</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Playfair+Display:wght@600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F6F1E6;--surface:#FFFCF5;--line:#E3D8C3;--fg:#1A2135;--muted:#5B5D6A;--faint:#8F8A80;--gold:#B8831A;--onaccent:#FFFCF5;--navy:#0D1220;--red:#B4432F;--ok:#2F7A4F;
 --f-disp:"Gloock",Georgia,serif;--f-read:"Newsreader",Georgia,serif;--f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;font-weight:400;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;font-family:var(--f-read);font-size:16px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--gold) 45%,transparent);border-color:var(--gold)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 0}
h1,h2{font-family:var(--f-disp);font-weight:400;margin:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--navy);color:#EDE7DA}
.logo{display:flex;align-items:center;gap:10px;font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:22px}
.logo img{width:30px;height:30px;border-radius:8px}
.logo .tag{font-family:var(--f-ui);font-size:13px;color:#C9A55A;letter-spacing:.04em}
.beta{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#E9B949;color:var(--navy);padding:3px 7px;border-radius:999px}
.top .sp{flex:1}.top select{width:auto;background:#141B2E;color:#EDE7DA;border-color:#252F4C;max-width:320px}
#who{font-size:13px;color:#A9B0C2}.top .lnk{color:#EDE7DA;font-size:13px;padding:6px 10px;border:1px solid #252F4C;border-radius:999px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--onaccent)}.btn.ghost{background:transparent}.btn.red{color:var(--red)}
.btn:disabled{opacity:.6}
.center{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px}
.card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px}
.card h1{font-size:30px;line-height:1.15}.sub{color:var(--muted);line-height:1.5;margin:10px 0 6px}
.card .btn{width:100%;margin-top:18px}.card .btn.ghost{margin-top:8px;border:0}
.code{font-size:30px;letter-spacing:.4em;text-align:center;margin-top:18px;font-family:"SF Mono",Menlo,monospace}
.err{color:var(--red);font-size:14px;margin:10px 0 0}
#main{display:grid;grid-template-columns:270px minmax(0,1fr) 380px;min-height:calc(100vh - 60px)}
aside.side{border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}
.side h4{margin:16px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sitem{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid transparent}
.sitem:hover{background:var(--surface)}.sitem.on{background:var(--surface);border-color:var(--gold)}
.sitem b{font-weight:600;line-height:1.3}.sitem small{color:var(--muted)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px}
.hint{color:var(--muted);font-size:14px;line-height:1.5}
#editor{padding:22px 28px 80px;max-width:820px}
.edtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}.edtop .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:#EDE3CC;color:var(--muted)}
.status.published{background:#DCEEDF;color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:2fr 80px 1.4fr;gap:12px}
label.big input{font-family:var(--f-disp);font-size:24px;padding:10px 14px}
#editor h3{margin:28px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.block{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:14px;padding:14px 16px 16px;margin-top:12px}
.bhead{display:flex;align-items:center;justify-content:space-between}.bname{font-weight:700;font-size:14px}
.bctl button{width:30px;height:30px;border-radius:8px;color:var(--muted)}.bctl button:hover{background:var(--bg)}
.block label:first-of-type{margin-top:8px}
.refchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rc{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.rc.ok{color:var(--gold);background:var(--surface)}.rc.bad{color:var(--red);border-color:#E7B5AA}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;color:var(--muted);font-size:14px}
.chip{border:1px dashed var(--line);border-radius:999px;padding:7px 12px;font-size:13.5px;color:var(--fg)}.chip:hover{border-color:var(--gold);color:var(--gold)}
.note{color:var(--faint);font-size:13px;margin-top:20px;line-height:1.5}
.danger{display:flex;gap:8px;margin-top:20px}
.empty{display:grid;place-items:center;gap:10px;min-height:50vh;text-align:center;color:var(--muted)}
aside.pvw{border-left:1px solid var(--line);padding:18px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.pv-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.phone{background:var(--navy);color:#EDE7DA;border-radius:28px;padding:22px 18px;border:8px solid #1d2438;min-height:70vh}
.pv h2{font-size:24px;line-height:1.15;margin:4px 0 6px}.pv-eye{color:#E9B949;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pv-meta{color:#A9B0C2;font-size:12.5px}
.pv h5{margin:20px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8C93A8}
.pv h4{display:flex;gap:8px;align-items:center;font-family:var(--f-disp);font-weight:400;font-size:18px;margin:20px 0 6px}
.pv h4 span{display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid #E9B949;color:#E9B949;border-radius:999px;font:600 12px var(--f-ui);flex:none}
.pv p,.pv li{font-family:var(--f-read);font-size:14.5px;line-height:1.5;margin:0 0 8px}
.pv-card{border:1px solid #262E47;border-left:3px solid #E9B949;border-radius:10px;padding:9px 11px;margin:8px 0;background:#151B2E}
.pv-card b{color:#E9B949;font-size:12.5px}.pv-card p{margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.pv-take{font-weight:600}.pv .rc{background:#151B2E;border-color:#262E47;color:#E9B949}
#modal{position:fixed;inset:0;background:rgba(13,18,32,.5);display:grid;place-items:center;z-index:20;padding:20px}
.mbox{width:min(640px,100%);background:var(--surface);border-radius:18px;padding:26px;max-height:90vh;overflow:auto}
.mbox h2{font-size:24px}.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.dres{margin-top:10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#EDE7DA;padding:12px 18px;border-radius:999px;font-weight:600;z-index:30}
@media (max-width:1180px){#main{grid-template-columns:240px minmax(0,1fr)}aside.pvw{display:none}}
@media (max-width:760px){#main{grid-template-columns:1fr}aside.side{border-right:0;border-bottom:1px solid var(--line)}#editor{padding:18px 16px 60px}.grid3,.grid2{grid-template-columns:1fr}.top{flex-wrap:wrap}#who{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><img src="../icon-192.png" alt=""><span class="brand-name">Arcs</span><span class="tag" data-t="tag"></span><span class="beta" data-t="beta"></span></div>
  <span class="sp"></span>
  <span id="who"></span>
  <button class="lnk" id="langBtn">DE</button>
  <button class="lnk" id="signOut" data-t="signOut" hidden></button>
</header>
<section id="auth" class="center" hidden><div class="card" id="authBox"></div></section>
<section id="register" class="center" hidden><div class="card" id="regBox"></div></section>
<section id="main" hidden>
  <aside class="side">
    <select id="churchSel"></select>
    <button class="btn gold" id="newSvc" data-t="newSvc"></button>
    <div id="slist"></div>
    <div class="foot"><a class="btn ghost" id="openApp" target="_blank" data-t="openApp"></a><button class="btn ghost" id="copyLink" data-t="shareLink"></button></div>
  </aside>
  <div id="editor"></div>
  <aside class="pvw" id="preview"></aside>
</section>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="booknames.js"></script>
<script src="portal.js"></script>
</body>
</html>
